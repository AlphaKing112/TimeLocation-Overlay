name = "timelocation-overlay"
main = "worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "OVERLAY_KV"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
